<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="50%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Holographic Neon Cyan Glow -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ruby Red Glow (Netflix accent hybrid) -->
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Metallic Visor Gradient -->
    <linearGradient id="visorMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Specular Light Reflection -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Cyber Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Outer Holographic Grid Pattern -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="8 12" />
    <circle cx="256" cy="256" r="170" fill="none" />
    <line x1="46" y1="256" x2="466" y2="256" stroke-dasharray="4 8" />
    <line x1="256" y1="46" x2="256" y2="466" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="16 16" />
  </g>

  <!-- Ambient Pulsing Core Light Behind Visor -->
  <circle cx="256" cy="235" r="95" fill="#00d4ff" opacity="0.22" filter="url(#neonBlur)" />
  <circle cx="256" cy="250" r="120" fill="#E50914" opacity="0.12" filter="url(#neonBlur)" />

  <!-- Outer Robotic Chassis / Collar -->
  <path d="M 140 430 C 180 380 332 380 372 430 L 400 512 L 112 512 Z" fill="#0b1329" stroke="#1e293b" stroke-width="3" />
  <path d="M 180 410 L 256 460 L 332 410" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.7" filter="url(#coreGlow)" />

  <!-- Cranial Armor Shell -->
  <path d="M 145 230 C 145 125 185 85 256 85 C 327 85 367 125 367 230 C 367 290 350 330 325 365 C 290 395 222 395 187 365 C 162 330 145 290 145 230 Z" 
        fill="url(#visorMetal)" 
        stroke="#334155" 
        stroke-width="3" />

  <!-- Cybernetic Temple Nodes -->
  <rect x="120" y="210" width="26" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="366" y="210" width="26" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <circle cx="133" cy="236" r="5" fill="#00f2fe" filter="url(#coreGlow)" />
  <circle cx="379" cy="236" r="5" fill="#00f2fe" filter="url(#coreGlow)" />

  <!-- Visor Face Shield (Glossy Holographic Glass) -->
  <path d="M 160 205 C 160 160 190 145 256 145 C 322 145 352 160 352 205 C 352 270 330 300 256 300 C 182 300 160 270 160 205 Z"
        fill="#040b17" 
        stroke="url(#cyanNeon)" 
        stroke-width="3" />

  <!-- Visor Reflection Curve -->
  <path d="M 175 165 C 210 155 300 155 337 165 C 344 190 330 205 310 195 C 260 170 205 180 175 165 Z"
        fill="url(#specularGleam)" />

  <!-- Holographic Optics / Eyes (Wide Cyber Visor HUD) -->
  <g filter="url(#coreGlow)">
    <!-- Main Neon Eye Beam Bar -->
    <rect x="180" y="212" width="152" height="18" rx="9" fill="#06b6d4" />
    <rect x="188" y="216" width="136" height="10" rx="5" fill="#ffffff" />
    
    <!-- Central AI Neural Optic Iris -->
    <circle cx="256" cy="221" r="14" fill="#00f2fe" />
    <circle cx="256" cy="221" r="7" fill="#ffffff" />
  </g>

  <!-- Lower Facial Audio Synthesizer Mesh (Soundwaves) -->
  <g transform="translate(196, 320)" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="10" y1="14" x2="10" y2="26" />
    <line x1="25" y1="8" x2="25" y2="32" />
    <line x1="40" y1="2" x2="40" y2="38" />
    <line x1="55" y1="12" x2="55" y2="28" />
    <line x1="60" y1="6" x2="60" y2="34" />
    <line x1="75" y1="0" x2="75" y2="40" />
    <line x1="90" y1="10" x2="90" y2="30" />
    <line x1="105" y1="16" x2="105" y2="24" />
  </g>

  <!-- Glowing Neural Circuit Traces on Forehead -->
  <path d="M 256 100 L 256 130" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="256" cy="100" r="3" fill="#38bdf8" />
  <path d="M 230 110 L 244 125" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 282 110 L 268 125" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- NEXA Branding Stamp at Bottom -->
  <rect x="186" y="445" width="140" height="32" rx="8" fill="#030712" stroke="#06b6d4" stroke-width="1.5" />
  <text x="256" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" letter-spacing="4" text-anchor="middle">NEXA • AI</text>
  <circle cx="204" cy="461" r="3" fill="#E50914" />
</svg>
